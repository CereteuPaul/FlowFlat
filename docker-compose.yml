version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowflat_db
    restart: always
    environment:
      POSTGRES_USER: flowflat_admin
      POSTGRES_PASSWORD: flowflat_secure_password
      POSTGRES_DB: flowflat
    ports:
      - "5432:5432"
    volumes:
      - flowflat_pgdata:/var/lib/postgresql/data

volumes:
  flowflat_pgdata:
